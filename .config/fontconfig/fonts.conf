<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Ubuntu Bold como fonte padrão (sans) -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Ubuntu</family></prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>Ubuntu</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <!-- Ubuntu Mono Nerd Font Mono Bold como monoespaçada padrão -->
  <alias>
    <family>monospace</family>
    <prefer><family>UbuntuMono Nerd Font Mono</family></prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>UbuntuMono Nerd Font Mono</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
